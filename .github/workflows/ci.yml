name: CI

on:
  # Direct pushes to main must run the suite too — as a solo-dev repo,
  # most commits land on main without a PR, and pull_request alone means
  # those ship untested.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check:syntax

      # public/v2/app.js and core.js are generated from public/v2/features and
      # @trebuchet/core. Rebuild them and fail if the committed copies differ.
      - name: Verify browser bundles are in sync with their sources
        run: |
          npm run build:js
          git diff --exit-code -- public/v2/app.js public/v2/core.js \
            || (echo '::error::Browser bundles are out of sync with their sources. Run "npm run build:js" and commit the result.' && exit 1)

      # Guards against the recurring bug where a new module is imported but
      # not added to package.json's "files"/"build.files". It works in dev
      # (runs from source) but is silently missing from the packaged Electron
      # app. The script computes the runtime import closure from main.js and
      # fails if any reachable file isn't listed in both arrays.
      - name: Verify package.json file lists cover all runtime modules
        run: npm run check:package

      - name: Install libsodium for the vanity grinder
        # The grinder tests build c/build/vanity_keygen, which links libsodium.
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - name: Build the vanity grinder
        # Build once, before the suite. Several test files run the binary in
        # parallel; building it mid-run let them see it missing or half-written.
        run: npm run build:c

      - name: Install Playwright browser
        # test/startup-freeze.test.mjs drives a headless Chromium.
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Core and runner contracts
        run: npm run test:architecture

      - name: CLI contract and binary smoke
        run: |
          npm run test:cli
          npm run cli -- doctor --json

      # Smoke tests exercise live RPC and Raydium API dependencies read-only.
      # No transactions are sent.  Requires the SMOKE_TEST_RPC repository
      # secret.  When the secret is unset (e.g. on forks), the test harness
      # skips itself gracefully and this step passes.
      - name: Smoke tests (read-only mainnet)
        continue-on-error: true
        env:
          TREBUCHET_SMOKE_TEST_RPC: ${{ secrets.SMOKE_TEST_RPC }}
        run: node --test test/smoke-launch.test.mjs

      - name: Blocking dependency audit policy
        run: npm run check:audit

      # Dependency audit gate. Replaces the previous pair of steps (a
      # blocking `--audit-level=critical` plus a non-blocking
      # `--audit-level=high`). That arrangement documented an invariant —
      # "the sole high finding is bigint-buffer" — that nothing enforced, and
      # it drifted to sixteen high-severity findings, including fixable ones
      # in the Electron/electron-builder toolchain, unnoticed until an
      # unrelated critical (node-tar) tripped the other gate.
      #
      # The gate script fails on ANY critical, and on any high that is not on
      # its reviewed allowlist. Allowlisted residuals are printed with the
      # reason they cannot be fixed. See scripts/audit-gate.mjs and the
      # residuals section of SECURITY.md.
      - name: Dependency audit gate
        run: node scripts/audit-gate.mjs

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      # ELECTRON_BUILDER_CACHE is set by the "Locate electron-builder cache"
      # step below, not here: it must live OUTSIDE the workspace (see that
      # step), which needs the runner context — unavailable at job level.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            smoke_command: npm exec electron-builder -- --mac --arm64 --dir --publish=never
            artifact: trebuchet-macos-arm64
          - name: Windows
            os: windows-latest
            smoke_command: npm exec electron-builder -- --win --dir --publish=never
            artifact: trebuchet-windows
          - name: Linux
            os: ubuntu-latest
            smoke_command: npm exec electron-builder -- --linux --dir --publish=never
            artifact: trebuchet-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: npm

      # electron-builder downloads CommonJS helper tools (the icons bundle's
      # icon-tool.js) into its cache and runs them with node. A cache under
      # the workspace inherits package.json's "type": "module" and the tools
      # fail with "require is not defined in ES module scope" (release
      # 1.0.49). Keep the cache outside the workspace. Done as a step rather
      # than job-level env because `runner.temp` is only available here.
      - name: Locate electron-builder cache
        shell: bash
        run: echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache" >> "$GITHUB_ENV"

      - name: Restore Electron caches
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-cache-${{ runner.os }}-${{ matrix.artifact }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-${{ matrix.artifact }}-

      - name: Install dependencies
        run: npm ci

      - name: Install libsodium for the vanity grinder
        # build:c links libsodium statically; without it (or OpenSSL) the
        # grinder would be the ~50x slower portable build (build:c refuses).
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew list libsodium >/dev/null 2>&1 || brew install libsodium; fi
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y libsodium-dev; fi

      - name: Build vanity keygen binary
        # Same rationale as release.yml: c/build/ is gitignored, the
        # asarUnpack pattern packages whatever's in it, so the smoke
        # build needs the binary present or it silently produces a
        # vanity-less package. Catching that here prevents a regression
        # from sliding all the way to a release.
        shell: bash
        run: npm run build:c

      - name: Build package smoke
        run: ${{ matrix.smoke_command }}

      - name: Run packaged v2 Electron smoke
        if: matrix.artifact == 'trebuchet-linux'
        run: xvfb-run -a npm run test:electron:v2:packaged

  e2e:
    name: E2E UI Flows
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      env:
        LANG: C.UTF-8
        TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run v2 API-backed E2E test
        run: npm run test:e2e:v2

      - name: Verify funding balances and automatic recovery
        run: node test/e2e/v2-funding-recovery.mjs

      - name: Run Recovery PIN browser checks
        run: npm run test:e2e:pin-gate

      - name: Run v2 desktop and mobile viewport smoke
        run: npm run test:v2:viewport
