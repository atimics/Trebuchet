name: Fee vault contract
on:
  pull_request:
    paths:
      - 'programs/fee-vault/**'
      - 'feeNft*.js'
      - 'feeVaultClient.js'
      - 'test/fee-nft*.test.mjs'
      - '.github/workflows/fee-vault.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --manifest-path programs/fee-vault/Cargo.toml
      - run: cargo test --locked --manifest-path programs/fee-vault/Cargo.toml
